<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="#20241F"/>

  <!-- The agent's trail: plan → search → read → synthesize,
       rendered as an ascending path of growing points -->
  <path
    d="M 14 48 L 26 39 L 38 30 L 50 16"
    stroke="#B8863B"
    stroke-width="2"
    stroke-opacity="0.45"
    stroke-linecap="round"
    fill="none"
  />

  <circle cx="14" cy="48" r="3" fill="#B8863B"/>
  <circle cx="26" cy="39" r="3.5" fill="#B8863B"/>
  <circle cx="38" cy="30" r="4" fill="#B8863B"/>

  <!-- Final point: the synthesized result, marked with a small spark -->
  <circle cx="50" cy="16" r="5.5" fill="#F0EEE4"/>
  <path
    d="M 50 8 L 51.3 13.7 L 57 15 L 51.3 16.3 L 50 22 L 48.7 16.3 L 43 15 L 48.7 13.7 Z"
    fill="#B8863B"
  />
</svg>
